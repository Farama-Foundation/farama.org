- type_name: General Standards
  type_description: Standards we strongly encourage reinforcement learning environment projects to follow where applicable
  type_standards:
    - title: Release Details
      standards:
        - requirement: Be released on PyPI.
          rationale: Users should be able to install libraries with `pip` without cloning Git repositories or running shell scripts.
        - requirement: Include a full package description on PyPI.
          rationale: Generally, this can reuse the README so that users can quickly understand a package when they find it on PyPI.
        - requirement: Publish packages automatically to PyPI using Trusted Publishing.
          rationale: Use a GitHub Actions workflow triggered by a published GitHub Release, a protected publishing environment, narrowly scoped OpenID Connect permissions, and artifacts that were built and tested separately. This reduces manual error and avoids long-lived PyPI credentials.
    - title: Standardization
      standards:
        - requirement: Support the latest stable Gymnasium and/or PettingZoo API.
          rationale: Supporting other APIs as well is fine. Using a current standard API makes environments easier to exchange and application code more modular.
        - requirement: Declare and test a supported Python version range.
          rationale: Projects should support all stable, non-EOL CPython versions when their dependencies permit it, and should document any exceptions or platform-specific constraints.
        - requirement: Display the supported Python versions as a badge in the README.
          rationale: Users should not have to read packaging metadata to learn whether a project supports their interpreter. Use the same shields.io Python-version badge as the other projects and point it at the package on PyPI so that it stays current as support changes.
    - title: Code Standardization
      standards:
        - requirement: Apply consistent linting and formatting.
          rationale: It makes easier to work with the project, we recommend making Python code to comply with Black, Flake8, and isort standards.
        - requirement: Add type hints where reasonable.
          rationale: Prioritize public-facing portions of the repository. Type hints can make code easier to understand and can help prevent or catch obscure bugs.
        - requirement: Include docstrings for all substantial functions.
          rationale: We recommend using the Google docstring convention and enforcing it with pydocstyle so that documentation is consistently formatted and easy to understand.
    - title: Development Workflow
      standards:
        - requirement: Run continuous integration tests.
          rationale: Test API compliance and determinism, and run type checking with Pyright. Tests must pass for all supported operating-system, architecture, and Python combinations.
        - requirement: Test built distributions before release.
          rationale: In continuous integration, build the source distribution and wheel, install them in clean environments, and run import and API-compliance tests. This catches missing package data, incorrect metadata, and build-isolation problems that tests against the source checkout may miss.
        - requirement: Include pre-commit hooks.
          rationale: Running linting checks through pre-commit helps contributors follow the project's style automatically. Run the same checks in continuous integration so they cannot be skipped inadvertently.
        - requirement: Automatically check the documentation website and README for broken links.
          rationale: Links rot as pages are renamed and external projects move, and dead links are a common source of frustration. Run a link checker over the built documentation and README from a scheduled GitHub Actions workflow so that maintainers discover breakages before users do.
    - title: Quality of Life
      standards:
        - requirement: Include a thorough documentation website when the project's user-facing scope warrants one.
          rationale: Follow the format of other mature projects so that experienced researchers and newcomers can understand the library and find reference material without reading its source.
        - requirement: Include an `AGENTS.md` file when the project may benefit from AI-assisted contributions.
          rationale: Document project-specific setup, testing, style, and contribution guidance so that coding agents can work safely and consistently without duplicating general contributor documentation.
    - title: Binaries
      standards:
        - requirement: Support x86_64 and Arm on Linux, and Apple silicon on macOS.
          rationale: The vast majority of software in this field runs on Linux servers, while many researchers develop on macOS. Students also often use Windows, so support for Windows x86_64 and Arm is encouraged when the project can support and test them reliably.
        - requirement: Provide wheels for supported platforms.
          rationale: Projects with native extensions should publish wheels for every supported operating-system, architecture, and Python combination. Pure-Python projects should publish a universal wheel.
        - requirement: Make native builds reproducible.
          rationale: Projects that distribute native binaries or compile code during installation should document and test their build inputs to reduce irreproducible artifacts.
    - title: Good Science
      standards:
        - requirement: Document and test determinism guarantees.
          rationale: Given the same seed, environment configuration, supported platform, and dependency versions, results should be reproducible within documented numerical tolerances. Any known nondeterministic backends or operations must be identified.
        - requirement: Include explicit versioning in environment and wrapper names.
          rationale: Use identifiers such as `Pong-v5` when configuration or behavior changes can affect scientific results, so that researchers can identify comparable environments.
        - requirement: Make environments reconstructible for supported workflows.
          rationale: Preserve the constructor arguments and state needed for experiment reproduction or process-based vectorization, using EzPickle or another documented mechanism where appropriate. Pickle data must be treated as trusted and compatibility boundaries must be documented.
    - title: User Experience
      standards:
        - requirement: Include polished rendering where visual rendering is meaningful.
          rationale: Rendering should be inviting and informative, especially for newcomers to reinforcement learning. Headless or abstract environments may omit rendering when that limitation is documented.
        - requirement: Include descriptive warnings and error messages.
          rationale: Raise explicit exception types for invalid input and runtime conditions, and use warnings for recoverable or deprecated behavior. Reserve `assert` statements for internal invariants because optimized Python can disable them.
    - title: Other
      standards:
        - requirement: Use an MIT-style open source license.
          rationale: Apache 2.0 and similarly permissive licenses are also acceptable. An explicit open source license is necessary to distribute free and open source software, and permissive licenses make broad reuse possible.
        - requirement: Generate documentation website information from environments directly.
          rationale: Avoid manually transcribing information that can be extracted from the source, which reduces errors and prevents documentation from becoming stale.

- type_name: Farama Standards
  type_description: Specific standards we enforce for projects inside Farama that generally do not apply to other projects
  type_standards:
    - title: Farama Branding
      standards:
        - requirement: Have a logo in the same style as the other projects.
          rationale: A polished logo makes a project more memorable and helps it fit naturally alongside the other Farama projects.
        - requirement: Have a documentation website at `[project].farama.org`.
          rationale: Keeping project websites under one domain makes them consistent for users and easier for Farama to manage.
        - requirement: Include the standard Farama code of conduct.
          rationale: All members of our community should be respected. A published code of conduct is also required for some open source donations.
    - title: Project Presentation
      standards:
        - requirement: Include a header image at the top of the README in the same style as the other projects.
          rationale: The README header is often a visitor's first impression. A consistent image makes the project recognizable and clearly associates it with Farama.
        - requirement: Set the GitHub social media preview image on the repository.
          rationale: This image appears when a repository link is shared on social media or in chat applications. Upload the project's header image under Settings > General > Social preview so that shared links are recognizable instead of using a generic placeholder.
        - requirement: Use a consistent project tagline everywhere the project is described.
          rationale: Keep the tagline consistent across the Farama projects page, GitHub repository About section, project Discord channel description, and documentation website subheader so that users receive the same description at every entry point.
    - title: Design Philosophy
      standards:
        - requirement: Do it right the first time and eliminate technical debt.
          rationale: Build flexible APIs that can be maintained for many years. Bringing an outside project into alignment with these standards may require carefully managed breaking changes.
        - requirement: Make APIs user-friendly and resistant to incorrect usage.
          rationale: New users should be able to use APIs correctly without needing to inspect the source code.
        - requirement: Use deprecation warnings whenever possible.
          rationale: Give users time to adapt before a breaking change. When advance deprecation is impossible, provide detailed errors and migration instructions.
    - title: Quality
      standards:
        - requirement: Include only environments that are scientifically important or commonly used.
          rationale: Prefer quality over quantity. Remove environments with little scientific value, or limit them to tutorials. Identify toy environments clearly and include them only when they are widely used.
        - requirement: Make projects polished and professional.
          rationale: Provide a comprehensive README and documentation website with straightforward wording, intuitive explanations, examples, and images.
        - requirement: Keep rendering high-quality and consistent between environments.
          rationale: We generally use Pygame for 2D Python graphics and create pixel art when native rendering does not exist.
    - title: Organization
      standards:
        - requirement: Limit each project to a single purpose.
          rationale: Where practical, separate standard APIs, utilities, environments, and datasets into focused repositories to make maintenance and usage simpler.
        - requirement: Limit external dependencies to well-maintained projects.
          rationale: An abandoned dependency can prevent long-term benchmark maintenance. For example, replace unmaintained PyBullet or MuJoCo-py integrations with maintained alternatives where possible.
        - requirement: Use semantic versioning.
          rationale: Limit maintenance releases to `0.0.x` version bumps and use `0.x.0` for standard pre-1.0 releases. Reserve `1.0.0` for initial maturity and later `x.0.0` releases for significant API changes or major functionality.
    - title: Development Practices
      standards:
        - requirement: Limit commits and PRs to a single purpose.
          rationale: Focused changes make reviews easier and reduce the chance of errors slipping into the codebase.
        - requirement: Use `main` as the default branch.
          rationale: Rename projects that still use `master` when they join Farama. Consistent branch naming means contributors working across projects do not have to track different conventions.
        - requirement: Block direct commits to the default branch in the repository settings.
          rationale: >-
            Develop on feature branches and merge them through PRs so that changes are reviewed. Add a GitHub ruleset targeting the default branch that requires a pull request before merging and blocks force pushes.
        - requirement: Communicate clearly with the community about upcoming changes.
          rationale: Share future development plans through release notes, appropriate announcements, and public roadmaps. Provide specific migration instructions for breaking changes.
    - title: Security
      standards:
        - requirement: Verify and sign commits with GPG or SSH keys.
          rationale: Signed commits help recipients verify that a commit was produced by someone who controls a recognized signing key.
        - requirement: List Jordan Terry, Mark Towers, and Marek Wydmuch as owners on PyPI.
          rationale: Multiple owners reduce the risk of losing control of a package if a primary maintainer becomes unexpectedly unavailable.
        - requirement: Require maintainers with GitHub or PyPI permissions to use TOTP-based 2FA or better.
          rationale: Strong authentication, secure passwords, and secure email addresses reduce the likelihood of supply-chain attacks against Farama projects.
    - title: Other
      standards:
        - requirement: Use Farama Notifications.
          rationale: Notifications let us warn users of older releases about important issues discovered after publication.
        - requirement: Include Google Analytics on all documentation websites.
          rationale: Analytics help us understand project popularity and how users navigate the documentation.
        - requirement: Include a Sponsor this project button on the GitHub repository.
          rationale: 'Add `.github/FUNDING.yml` with `github: Farama-Foundation`.'
